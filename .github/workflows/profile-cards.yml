name: Update profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions: {}

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  update-cards:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Refresh upstream PRs and activity card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: |
          gh api --paginate --slurp --method GET search/issues \
            -f "q=is:pr is:public is:merged author:${PROFILE_OWNER} -user:${PROFILE_OWNER}" \
            -f per_page=100 | node scripts/refresh-upstream-prs.mjs

      - name: Commit changed profile files
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md profile/upstream-activity*.svg
          if git diff --cached --quiet; then
            echo "Profile files are already up to date."
          else
            git commit -m "chore: refresh upstream activity"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
