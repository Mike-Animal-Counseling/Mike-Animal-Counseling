name: Update profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions: {}

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  update-cards:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Refresh recent merged upstream PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: |
          gh api --paginate --slurp --method GET search/issues \
            -f "q=is:pr is:public is:merged author:${PROFILE_OWNER} -user:${PROFILE_OWNER}" \
            -f per_page=100 | node scripts/refresh-upstream-prs.mjs

      - name: Generate public activity card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&theme=default&hide_border=true&disable_animations=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: '2.2.0'
          fail_on_error: 'true'

      - name: Generate public language card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&exclude_repo=${{ github.event.repository.name }}&theme=default&hide_border=true&disable_animations=true&card_width=300
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: '2.2.0'
          fail_on_error: 'true'

      - name: Generate dark activity card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&theme=github_dark&hide_border=true&disable_animations=true
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: '2.2.0'
          fail_on_error: 'true'

      - name: Generate dark language card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&exclude_repo=${{ github.event.repository.name }}&theme=github_dark&hide_border=true&disable_animations=true&card_width=300
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: '2.2.0'
          fail_on_error: 'true'

      - name: Commit changed profile files
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md profile/stats.svg profile/top-langs.svg profile/stats-dark.svg profile/top-langs-dark.svg
          if git diff --cached --quiet; then
            echo "Profile files are already up to date."
          else
            git commit -m "chore: refresh profile contributions and cards"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
